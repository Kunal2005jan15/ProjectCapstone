version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: food-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_platform
      POSTGRES_USER: food_platform_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - food_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_platform_user -d food_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  food_platform_pgdata:
