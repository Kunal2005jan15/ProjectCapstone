server:
  port: 8080

spring:
  application:
    name: food-platform-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:food_platform}
    username: ${DB_USERNAME:food_platform_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Render's free-tier Postgres/network silently drops connections that sit idle
      # for a few minutes. Without these, a stale pooled connection gets handed to
      # a query and fails with a raw SQLException -> falls through to the generic
      # 500 handler. Retiring connections before that happens (and pinging idle
      # ones) avoids the intermittent "first request after idle fails" 500s.
      max-lifetime: 240000        # retire connections after 4 min, well under Render's idle cutoff
      keepalive-time: 120000      # ping idle connections every 2 min to keep them alive
      connection-timeout: 20000   # fail fast (20s) instead of hanging if the DB is truly unreachable
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_BEFORE_DEPLOYING_TO_PRODUCTION}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
    issuer: food-platform-backend

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    # Shared secret the ml-service presents via the X-ML-Service-Key header
    # when pushing forecasts (POST /api/v1/shops/{shopId}/forecasts).
    # Blank by default -> that endpoint stays OWNER/ADMIN-JWT-only, i.e.
    # this feature is fully opt-in and off until you set ML_PUSH_API_KEY.
    push-api-key: ${ML_PUSH_API_KEY:}

  # Payment provider switch. "off" = Razorpay is not available yet: checkout
  # completes without any real payment step (see PaymentService). Set to
  # "razorpay" (and provide real keys below) once Razorpay is ready - no other
  # code changes should be needed to flip this switch.
  payment:
    provider: ${PAYMENT_PROVIDER:off}

  # Only used when app.payment.provider=razorpay. Leave blank to run checkout
  # in mock payment mode even if provider=razorpay (safety fallback).
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

  inventory:
    low-stock-alert-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.foodplatform.backend: DEBUG
    org.hibernate.SQL: WARN
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
